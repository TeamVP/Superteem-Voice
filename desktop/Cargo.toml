[package]
name = "superteem-voice"
version = "0.2.4"
edition = "2021"
license = "GPL-3.0-only"

[lib]
# Android loads the app as a shared library; Windows links it into the exe.
name = "superteem_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
stv-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "custom-protocol"] }
# Downloads trust Mozilla's roots built into the app plus the system's own store, which company proxies
# add their certificates to. The system store alone left Android trusting nothing.
ureq = { version = "2", features = ["socks-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
whisper-rs = "0.16"

# Android records in its Kotlin foreground service, so these are Windows only.
[target.'cfg(not(target_os = "android"))'.dependencies]
btleplug = "0.11"
cpal = "0.15"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
trash = "5"
uuid = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Created by build-env.ps1: the published crate with one cross-compiling fix.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[profile.release]
opt-level = 2
