[package]
name = "superteem-voice"
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-only"

[lib]
# Android loads the app as a shared library, the iPhone links the static one into its Xcode project, and
# Windows and the Mac link it into the executable.
name = "superteem_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
stv-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset", "custom-protocol"] }
# Downloads trust Mozilla's roots built into the app plus the system's own store, which company proxies
# add their certificates to. The system store alone left Android trusting nothing.
ureq = { version = "2", features = ["socks-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.7"
webpki-roots = "0.26"
whisper-rs = "0.16"
# Local language model for analysis templates (Phase 1). Pinned: whisper.cpp is built against its ggml
# (build-env.ps1), so the two must move together. Default features pull in OpenMP, which
# whisper.cpp does not use here.
llama-cpp-2 = { version = "=0.1.161", default-features = false }
# Chat templates llama.cpp's built-in list doesn't know, rendered from the model's own Jinja template.
minijinja = "3"
minijinja-contrib = { version = "3", features = ["pycompat"] }
# Checks downloaded models against their published fingerprints.
sha2 = "0.10"
# Memory and free disk space, to size the model's context and check a download fits.
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk"] }

# Android records in its Kotlin foreground service, so these are for Windows, the Mac and the iPhone.
[target.'cfg(not(target_os = "android"))'.dependencies]
btleplug = "0.11"
cpal = "0.15"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
uuid = "1"

# Deleted meetings go to the Recycle Bin or the Trash. Phones have neither.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
trash = "5"

# The iPhone's audio session is set up through Objective-C, and its links open through the system.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
tauri-plugin-opener = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Created by build-env.ps1: the published crate with one cross-compiling fix.
[patch.crates-io]
whisper-rs-sys = { path = "vendor/whisper-rs-sys" }

[profile.release]
opt-level = 2
