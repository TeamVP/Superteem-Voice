<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Voice by Superteem</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="show-list">
  <aside class="sidebar">
    <div class="brand-row">
      <button class="brand" title="Home" aria-label="Voice by Superteem">
        <span class="product">Voice</span>
        <span class="by">by</span>
        <img class="logo-light-mode" src="logo-light-mode.png" alt="">
        <img class="logo-dark-mode" src="logo-dark-mode.png" alt="">
      </button>
      <button id="listen-chip" class="listen-chip pill windows-only" title="Listening for “Hey Superteem”. Click to talk.">
        <svg class="ear" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8.5a6.5 6.5 0 1 1 13 0c0 6-6 6-6 10a3.5 3.5 0 1 1-7 0"></path><path d="M15 8.5a2.5 2.5 0 0 0-5 0v1a2 2 0 1 1 0 4"></path></svg><span id="listen-label" class="label">Voice off</span>
      </button>
    </div>
    <div class="quick">
      <button id="open-home" class="home-btn" title="Home" aria-label="Home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7M5 10v10h5v-6h4v6h5V10"></path></svg>
      </button>
      <button id="new-note" title="New note" aria-label="New note">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg><span class="label">New note</span>
      </button>
      <button id="new-meeting" title="Record a meeting" aria-label="Meeting">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9v6M8 6v12M12 10v4M16 7v10M20 10v4"></path></svg><span class="label">Meeting</span>
      </button>
    </div>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="search" type="search" placeholder="Search notes and meetings" autocomplete="off" aria-label="Search notes and meetings">
    </label>
    <nav id="items" class="items" aria-label="Notes and meetings"></nav>
    <button id="new-fab" class="new-fab" title="New" aria-label="New note, meeting, call or event">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <div id="update-bar" class="update-bar" role="status" hidden></div>
    <div class="sidebar-foot">
      <button id="open-settings" class="link">Settings</button>
      <button id="open-shortcuts" class="link shortcuts-link windows-only" title="Keyboard shortcuts">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h.01M18 14h.01M9 14h6"></path></svg>Shortcuts
      </button>
    </div>
  </aside>
  <div id="splitter" class="splitter" role="separator" aria-orientation="vertical" aria-label="Resize the sidebar" tabindex="0" title="Drag to resize. Double-click to reset."></div>
  <main id="main-wrap">
    <button id="back" class="link back">‹ Back to Feed</button>
    <div id="main"></div>
  </main>

  <section id="agent" class="agent" hidden aria-live="polite" aria-label="Talk to Superteem">
    <div class="top">
      <span>Voice mode · screen optional · replies are spoken</span>
      <button id="agent-close" class="pill">Close</button>
    </div>
    <div id="agent-log" class="log"></div>
    <div class="foot">
      <div id="agent-bars" class="bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      <div id="agent-state" class="state">Listening</div>
      <div id="agent-actions" class="agent-actions"></div>
      <form id="agent-type" class="type">
        <input id="agent-input" placeholder="Or type a command" aria-label="Type a command" autocomplete="off">
        <button class="primary pill">Send</button>
      </form>
      <div id="agent-say" class="say"></div>
    </div>
  </section>
  <script src="vendor/note-editor.js"></script>
  <script src="commands.js"></script>
  <script src="app.js"></script>
  <script src="analysis.js"></script>
  <script src="languages.js"></script>
  <script src="notes-ai.js"></script>
  <script src="optimise.js"></script>
</body>
</html>
