[package]
name = "stv-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
cc = "1"

[dependencies]
crc32fast = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
zip = { version = "2", default-features = false }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
