# Publishes the download page in site/ to GitHub Pages, served at voice.superteem.com.
# The page reads the latest release from GitHub as it loads, so new releases need no redeploy.
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/brand
          cp -r site/. _site/
          cp public/Superteem-only-dark.png public/Superteem-only-light.png public/favicon.svg public/appicon.png _site/brand/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
