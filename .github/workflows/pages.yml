# Publishes the download page in site/ to GitHub Pages, served at voice.superteem.com, with a copy of the
# latest release's files in download/. GitHub's release download links have timed out for hours at a
# time, so the page offers these copies first. The release workflow runs this once it publishes.
name: Pages
on:
  push:
    branches: [main]
    paths: ["site/**", "public/**", ".github/workflows/pages.yml"]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  # Write, to make the commit object each deployment is named after (see "Deploy to GitHub Pages").
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site/brand
          cp -r site/. _site/
          cp public/Superteem-only-dark.png public/Superteem-only-light.png public/favicon.svg public/appicon.png _site/brand/
      # Through the API, which kept working while the release download links returned 504.
      - name: Copy the latest release's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/download
          if ! gh api "repos/$GITHUB_REPOSITORY/releases/latest" > latest.json; then
            echo "::warning::No release to copy yet."
            exit 0
          fi
          jq -c '.assets[] | {id, name, size}' latest.json | while read -r asset; do
            id=$(jq -r .id <<< "$asset"); name=$(jq -r .name <<< "$asset"); size=$(jq -r .size <<< "$asset")
            curl -sSfL --retry 8 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id" -o "_site/download/$name"
            actual=$(stat -c %s "_site/download/$name")
            if [ "$actual" != "$size" ]; then echo "::error::$name is $actual bytes, expected $size"; exit 1; fi
          done
          # What the page shows: the version, when it came out, and the files beside it.
          # This is a static file. The app adds a query when it asks for the file; GitHub Pages does not store
          # that query, and this repository gets no access log, so the parameters are not collected here.
          jq '{tag_name, published_at, html_url, assets: [.assets[] | {name, size}]}' latest.json > _site/download/release.json
          ls -l _site/download
      - uses: actions/configure-pages@v5
      - id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # GitHub Pages names each deployment after a commit, and treats a second deployment of a commit it has
      # already deployed as done without publishing it. A release tagged on a commit whose site changes were
      # deployed on push then left the page offering the previous release. So each run makes its own commit
      # object (the same files and parent, on no branch) and deploys under that, through the same API
      # actions/deploy-pages uses.
      - id: deployment
        name: Deploy to GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact_id }}
        run: |
          set -o pipefail
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          tree=$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)
          version=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/commits" -f tree="$tree" -f "parents[]=$GITHUB_SHA" \
            -f message="Download page deployment, run $GITHUB_RUN_ID attempt $GITHUB_RUN_ATTEMPT" --jq .sha)
          created=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments" \
            -F artifact_id="$ARTIFACT_ID" -f pages_build_version="$version" -f oidc_token="$oidc")
          id=$(jq -r .id <<< "$created")
          echo "page_url=$(jq -r .page_url <<< "$created")" >> "$GITHUB_OUTPUT"
          echo "Deployment $id for $version"
          for attempt in $(seq 1 120); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$id" --jq .status)
            echo "Status: $status"
            case "$status" in
              succeed) exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost|deployment_attempt_error)
                echo "::error::The Pages deployment ended with $status"; exit 1 ;;
            esac
            sleep 5
          done
          echo "::error::The Pages deployment didn't finish in 10 minutes"
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$id/cancel" || true
          exit 1
