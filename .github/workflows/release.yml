# Builds the Windows, Mac and Android apps and publishes them as a GitHub release when a version tag such as v0.2.0 is
# pushed. The iPhone app is built too, and sent to TestFlight when Apple's signing secrets are set.
# The download page at voice.superteem.com links to the latest release's files by these fixed names.
# Run it by hand from the Actions tab to build without publishing; the files are then kept as workflow artifacts.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WINDOWS_FILE: Voice-by-Superteem-Setup-x64.exe
  ANDROID_FILE: Voice-by-Superteem-Android.apk
  MAC_FILE: Voice-by-Superteem-macOS.dmg

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r .version desktop/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in desktop/tauri.conf.json"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          # Changed when how whisper.cpp is compiled changes, so an old build of it isn't reused.
          prefix-key: v1-portable-cpu
      # Tauri downloads NSIS and its plugin from GitHub release links, which have returned 504 for hours at a
      # time while the same files came through the API. They are fetched that way, with the hashes Tauri
      # 2.12 checks, into the folder Tauri looks in first.
      - name: Fetch the installer tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Fetch($repo, $tag, $name, $sha1, $out) {
            $id = gh api "repos/$repo/releases/tags/$tag" --jq ".assets[] | select(.name == `"$name`") | .id"
            if (-not $id) { throw "$name is not in $repo $tag" }
            curl.exe -sSfL --retry 5 --retry-all-errors -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/octet-stream' `
              "https://api.github.com/repos/$repo/releases/assets/$id" -o $out
            if ($LASTEXITCODE -ne 0) { throw "Could not download $name" }
            $hash = (Get-FileHash $out -Algorithm SHA1).Hash
            if ($hash -ne $sha1) { throw "$name has hash $hash, expected $sha1" }
          }
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis = Join-Path $tools 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            New-Item -ItemType Directory -Force $tools | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
            Fetch 'tauri-apps/binary-releases' 'nsis-3.13' 'nsis-3.13.zip' 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E' $zip
            Expand-Archive $zip $tools -Force
            Rename-Item (Join-Path $tools 'nsis-3.13') 'NSIS'
          }
          $additional = Join-Path $nsis 'Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force $additional | Out-Null
          Fetch 'tauri-apps/nsis-tauri-utils' 'nsis_tauri_utils-v0.5.3' 'nsis_tauri_utils.dll' '75197FEE3C6A814FE035788D1C34EAD39349B860' (Join-Path $additional 'nsis_tauri_utils.dll')
      - name: Build the installer
        shell: pwsh
        run: |
          . desktop/build-env.ps1
          Push-Location desktop
          npm ci --no-audit --no-fund
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          Pop-Location
          # whisper.cpp built for this machine's processor uses AVX-512 and crashes most PCs when speech is
          # turned into text, so the release stops if that happened.
          $cache = Get-ChildItem desktop/target/release/build -Recurse -Filter CMakeCache.txt | Where-Object { $_.FullName -match 'whisper-rs-sys' }
          if (-not $cache) { throw 'whisper.cpp build settings not found' }
          foreach ($c in $cache) {
            $text = Get-Content $c.FullName -Raw
            if ($text -notmatch 'GGML_NATIVE:BOOL=OFF' -or $text -notmatch 'GGML_AVX512:BOOL=OFF') { throw "whisper.cpp was built for this machine's processor: $($c.FullName)" }
          }
          $setup = Get-ChildItem desktop/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $setup.FullName "dist/$env:WINDOWS_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  android:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          # Changed when how whisper.cpp is compiled changes, so an old build of it isn't reused.
          prefix-key: v1-portable-cpu
      - run: rustup target add aarch64-linux-android
      # services.gradle.org sends the Gradle download on to a GitHub release link, which has returned 504 for
      # hours at a time. The same file comes through the API, is checked against the checksum pinned in
      # gradle-wrapper.properties, and the wrapper is pointed at it for this build.
      - name: Fetch Gradle
        shell: pwsh
        working-directory: desktop/gen/android
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $props = 'gradle/wrapper/gradle-wrapper.properties'
          $text = Get-Content $props -Raw
          $url = [regex]::Match($text, 'distributionUrl=(\S+)').Groups[1].Value.Replace('\:', ':')
          $sum = [regex]::Match($text, 'distributionSha256Sum=(\S+)').Groups[1].Value
          $name = Split-Path $url -Leaf
          $tag = 'v' + ($name -replace '^gradle-(.+)-bin\.zip$', '$1')
          $zip = Join-Path $env:RUNNER_TEMP $name
          $id = gh api "repos/gradle/gradle-distributions/releases/tags/$tag" --jq ".assets[] | select(.name == `"$name`") | .id"
          if ($id) {
            curl.exe -sSfL --retry 5 --retry-all-errors -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/octet-stream' `
              "https://api.github.com/repos/gradle/gradle-distributions/releases/assets/$id" -o $zip
          }
          if ($id -and $LASTEXITCODE -eq 0 -and (Get-FileHash $zip -Algorithm SHA256).Hash -eq $sum) {
            $local = 'file\:///' + $zip.Replace('\', '/').Replace(':', '\:')
            Set-Content $props ($text.Replace("distributionUrl=$($url.Replace(':', '\:'))", "distributionUrl=$local")) -NoNewline
            Write-Output "Using $zip"
          } else {
            Write-Output '::warning::Gradle could not be fetched through the API; the wrapper downloads it instead.'
          }
          foreach ($attempt in 1..4) {
            ./gradlew.bat --version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Output "Gradle download attempt $attempt failed; trying again."
            Start-Sleep -Seconds (15 * $attempt)
          }
          throw 'Could not download Gradle'
      # Maven Central sends the Kotlin compiler on to a GitHub release link from these machines, and those
      # links have returned 504 for hours. Google's mirror of Maven Central serves the files itself, so
      # every Gradle build here (buildSrc and plugins included) is pointed at it.
      - name: Use Google's Maven Central mirror
        shell: pwsh
        run: |
          $dir = Join-Path $env:USERPROFILE '.gradle\init.d'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Set-Content (Join-Path $dir 'central-mirror.gradle') @'
          def mirror = 'https://maven-central.storage-download.googleapis.com/maven2/'
          def useMirror = { RepositoryHandler repos ->
              repos.withType(MavenArtifactRepository).configureEach { repo ->
                  def url = repo.url.toString()
                  if (url.startsWith('https://repo.maven.apache.org/maven2') || url.startsWith('https://repo1.maven.org/maven2')) {
                      repo.url = mirror
                  }
              }
          }
          beforeSettings { settings ->
              useMirror(settings.pluginManagement.repositories)
              useMirror(settings.dependencyResolutionManagement.repositories)
          }
          allprojects {
              useMirror(buildscript.repositories)
              useMirror(repositories)
          }
          '@
      - name: Build the APK
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ($env:KEYSTORE_BASE64) {
            $env:STV_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.jks'
            [IO.File]::WriteAllBytes($env:STV_KEYSTORE, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            # A debug-signed APK can't be updated by later releases, so it is never published.
            Write-Output '::warning::The Android signing secrets are not set, so this release has no Android app.'
            exit 0
          }
          # Gradle fetches its plugins and the Kotlin compiler as it builds, some through GitHub release links
          # that have returned 504 for a while. A retry reuses the compiled Rust, so it is quick.
          foreach ($attempt in 1..3) {
            try {
              ./desktop/build-android.ps1 -Targets aarch64
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Output "::warning::Android build attempt $attempt failed ($_); trying again."
              Start-Sleep -Seconds 60
            }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/target/superteem-voice.apk "dist/$env:ANDROID_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
          if-no-files-found: ignore

  # The Mac app, for Apple silicon. Signed and notarized with the Developer ID secrets when they are set:
  # APPLE_CERTIFICATE (the .p12, base64), APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, and for
  # notarizing APPLE_API_ISSUER, APPLE_API_KEY and APPLE_API_KEY_P8 (the App Store Connect key's text).
  # Without them it is signed ad hoc, which runs on Apple silicon once it is allowed in Privacy & Security.
  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          prefix-key: v1-apple
      - name: Build the disk image
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # Tauri takes a variable that is set but empty, as a missing secret is, as one to use.
          if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ] && [ -n "$APPLE_API_ISSUER" ]; then
              export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY.p8"
              printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH"
            else
              unset APPLE_API_ISSUER APPLE_API_KEY
              echo "::warning::The App Store Connect key isn't set, so the Mac app is signed but not notarized."
            fi
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER APPLE_API_KEY
            export APPLE_SIGNING_IDENTITY=-
            echo "::warning::The Developer ID secrets aren't set, so the Mac app is signed ad hoc and macOS asks before it first opens."
          fi
          unset APPLE_API_KEY_P8
          rustup target add aarch64-apple-darwin
          source desktop/build-env.sh
          cd desktop
          npm ci
          npm run tauri -- build --bundles dmg --target aarch64-apple-darwin
          mkdir -p ../dist
          cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg "../dist/$MAC_FILE"
          ls -l ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  # The iPhone app. Its Xcode project is made fresh each time by `tauri ios init`. Without signing secrets
  # it is built for the Simulator, which checks everything compiles. With them (APPLE_DEVELOPMENT_TEAM,
  # IOS_CERTIFICATE, IOS_CERTIFICATE_PASSWORD, IOS_MOBILE_PROVISION, and the App Store Connect key above)
  # it is built for the App Store and a tagged release is uploaded to TestFlight. The .ipa isn't put in the
  # GitHub release, as an App Store build can only be installed through Apple.
  ios:
    needs: version
    runs-on: macos-15
    # A step's own env isn't readable in its `if`, so whether the secrets are set is said here.
    env:
      IOS_SIGNED: ${{ secrets.IOS_CERTIFICATE != '' }}
      TESTFLIGHT: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          prefix-key: v1-ios
      - name: Make the Xcode project
        run: |
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          source desktop/build-env.sh
          cd desktop
          npm ci
          npm run tauri -- ios init --ci
          # The iPhone's icons, with no transparency, which the App Store refuses.
          npm run tauri -- icon icons/icon.png --ios-color '#ffffff'
      - name: Build for the Simulator
        if: env.IOS_SIGNED != 'true'
        run: |
          echo "::warning::The iPhone signing secrets aren't set, so the app is only built for the Simulator."
          source desktop/build-env.sh
          cd desktop
          # Through the Tauri CLI, as the Xcode project's build step asks the running CLI how to build the Rust.
          npm run tauri -- ios build --target aarch64-sim --no-sign
      - name: Build for the App Store
        if: env.IOS_SIGNED == 'true'
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
        run: |
          source desktop/build-env.sh
          cd desktop
          npm run tauri -- ios build --export-method app-store-connect
          mkdir -p ../dist
          cp gen/apple/build/arm64/*.ipa ../dist/Voice-by-Superteem-iOS.ipa
          ls -l ../dist
      - name: Upload to TestFlight
        if: env.IOS_SIGNED == 'true' && env.TESTFLIGHT == 'true' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$APPLE_API_KEY.p8
          xcrun altool --upload-app --type ios --file dist/Voice-by-Superteem-iOS.ipa \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/
          if-no-files-found: ignore

  # Publishes whatever was built. The Windows app is required; Android and the Mac are left out if they failed.
  release:
    needs: [windows, android, macos]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          # The iPhone app goes to TestFlight, not the release.
          pattern: "{windows,android,macos}"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Voice by Superteem ${GITHUB_REF_NAME#v}" --generate-notes
      # The download page serves its own copy of the release's files. A release made with this workflow's
      # token doesn't start other workflows, so the page is republished here.
      - name: Republish the download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
