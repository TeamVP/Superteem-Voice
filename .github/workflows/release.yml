# Builds the Windows and Android apps and publishes them as a GitHub release when a version tag such as v0.2.0 is pushed.
# The download page at voice.superteem.com links to the latest release's files by these fixed names.
# Run it by hand from the Actions tab to build without publishing; the files are then kept as workflow artifacts.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  WINDOWS_FILE: Superteem-Voice-Setup-x64.exe
  ANDROID_FILE: Superteem-Voice-Android.apk

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(jq -r .version desktop/tauri.conf.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $version in desktop/tauri.conf.json"
            exit 1
          fi

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          # Changed when how whisper.cpp is compiled changes, so an old build of it isn't reused.
          prefix-key: v1-portable-cpu
      # Tauri downloads NSIS and its plugin from GitHub release links, which have returned 504 for hours at a
      # time while the same files came through the API. They are fetched that way, with the hashes Tauri
      # 2.12 checks, into the folder Tauri looks in first.
      - name: Fetch the installer tools
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          function Fetch($repo, $tag, $name, $sha1, $out) {
            $id = gh api "repos/$repo/releases/tags/$tag" --jq ".assets[] | select(.name == `"$name`") | .id"
            if (-not $id) { throw "$name is not in $repo $tag" }
            curl.exe -sSfL --retry 5 --retry-all-errors -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/octet-stream' `
              "https://api.github.com/repos/$repo/releases/assets/$id" -o $out
            if ($LASTEXITCODE -ne 0) { throw "Could not download $name" }
            $hash = (Get-FileHash $out -Algorithm SHA1).Hash
            if ($hash -ne $sha1) { throw "$name has hash $hash, expected $sha1" }
          }
          $tools = Join-Path $env:LOCALAPPDATA 'tauri'
          $nsis = Join-Path $tools 'NSIS'
          if (-not (Test-Path (Join-Path $nsis 'makensis.exe'))) {
            New-Item -ItemType Directory -Force $tools | Out-Null
            $zip = Join-Path $env:RUNNER_TEMP 'nsis.zip'
            Fetch 'tauri-apps/binary-releases' 'nsis-3.13' 'nsis-3.13.zip' 'DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E' $zip
            Expand-Archive $zip $tools -Force
            Rename-Item (Join-Path $tools 'nsis-3.13') 'NSIS'
          }
          $additional = Join-Path $nsis 'Plugins\x86-unicode\additional'
          New-Item -ItemType Directory -Force $additional | Out-Null
          Fetch 'tauri-apps/nsis-tauri-utils' 'nsis_tauri_utils-v0.5.3' 'nsis_tauri_utils.dll' '75197FEE3C6A814FE035788D1C34EAD39349B860' (Join-Path $additional 'nsis_tauri_utils.dll')
      - name: Build the installer
        shell: pwsh
        run: |
          . desktop/build-env.ps1
          Push-Location desktop
          npm ci --no-audit --no-fund
          npm run tauri -- build --bundles nsis
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          Pop-Location
          # whisper.cpp built for this machine's processor uses AVX-512 and crashes most PCs when speech is
          # turned into text, so the release stops if that happened.
          $cache = Get-ChildItem desktop/target/release/build -Recurse -Filter CMakeCache.txt | Where-Object { $_.FullName -match 'whisper-rs-sys' }
          if (-not $cache) { throw 'whisper.cpp build settings not found' }
          foreach ($c in $cache) {
            $text = Get-Content $c.FullName -Raw
            if ($text -notmatch 'GGML_NATIVE:BOOL=OFF' -or $text -notmatch 'GGML_AVX512:BOOL=OFF') { throw "whisper.cpp was built for this machine's processor: $($c.FullName)" }
          }
          $setup = Get-ChildItem desktop/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $setup.FullName "dist/$env:WINDOWS_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  android:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
          # Changed when how whisper.cpp is compiled changes, so an old build of it isn't reused.
          prefix-key: v1-portable-cpu
      - run: rustup target add aarch64-linux-android
      # The Gradle wrapper tries its download once, and services.gradle.org has been slow enough to fail it.
      # Fetching it first, with retries, leaves it in the cache for the build.
      - name: Fetch Gradle
        shell: pwsh
        working-directory: desktop/gen/android
        run: |
          foreach ($attempt in 1..4) {
            ./gradlew.bat --version
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Output "Gradle download attempt $attempt failed; trying again."
            Start-Sleep -Seconds (15 * $attempt)
          }
          throw 'Could not download Gradle'
      - name: Build the APK
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if ($env:KEYSTORE_BASE64) {
            $env:STV_KEYSTORE = Join-Path $env:RUNNER_TEMP 'release.jks'
            [IO.File]::WriteAllBytes($env:STV_KEYSTORE, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          } elseif ($env:GITHUB_REF -like 'refs/tags/*') {
            # A debug-signed APK can't be updated by later releases, so it is never published.
            Write-Output '::warning::The Android signing secrets are not set, so this release has no Android app.'
            exit 0
          }
          # Gradle fetches its plugins and the Kotlin compiler as it builds, some through GitHub release links
          # that have returned 504 for a while. A retry reuses the compiled Rust, so it is quick.
          foreach ($attempt in 1..3) {
            try {
              ./desktop/build-android.ps1 -Targets aarch64
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Write-Output "::warning::Android build attempt $attempt failed ($_); trying again."
              Start-Sleep -Seconds 60
            }
          }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktop/target/superteem-voice.apk "dist/$env:ANDROID_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
          if-no-files-found: ignore

  # Publishes whatever was built. The Windows app is required; Android is left out if it failed.
  release:
    needs: [windows, android]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Superteem Voice ${GITHUB_REF_NAME#v}" --generate-notes
